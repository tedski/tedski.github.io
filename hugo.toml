baseURL = "https://www.tedski.net"
title = "tedski.net"
theme = "PaperMod"
languageCode = "en-us"
paginate = 10

[params]
author = "Ted Strzalkowski"
description = "Do it right, understand the why, leave it better than you found it."
showReadingTime = true
showShareButtons = false
showPostNavLinks = true
showBreadCrumbs = false
showCodeCopyButtons = true
showToc = false
comments = false
  
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"

  [params.profileMode]
  enabled = true
  title = "Ted Strzalkowski"
  subtitle = """
Somewhere between the woodworking, the water, and the occasional hardware
teardown, a philosophy emerged: **do it right, understand the why, and leave
it better than you found it**. It applies to distributed systems the same way
it applies to a dovetail joint. Currently between roles and going deeper on
all of it. Resume's in the nav if that's what brought you here.
"""

  [params.homeInfoParams]
  enabled = false
  Title = "Ted Strzalkowski"
  Content = """
Somewhere between the woodworking, the water, and the occasional hardware
teardown, a philosophy emerged: **do it right, understand the why, and leave
it better than you found it**. It applies to distributed systems the same way
it applies to a dovetail joint. Currently between roles and going deeper on
all of it. Resume's in the nav if that's what brought you here.
"""

  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/tedski"

  [[params.socialIcons]]
  name = "linkedin"
  url = "https://linkedin.com/in/tedski"

[[menu.main]]
name = "Resume"
url = "/resume/"
