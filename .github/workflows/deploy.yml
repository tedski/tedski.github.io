name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    container:
      image: pandoc/extra:latest
    steps:
      - name: Install git
        run: apk add --no-cache git
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Register TeX Live fonts
        run: |
          echo '<fontconfig><dir>/opt/texlive/texdir/texmf-dist/fonts/opentype</dir></fontconfig>' \
            > /etc/fonts/conf.d/99-texlive.conf
          fc-cache -f
      - name: Generate resume PDF
        run: |
          pandoc content/resume.md \
            --defaults pandoc/defaults.json \
            -o static/Resume-TedStrzalkowski.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: resume-pdf
          path: static/Resume-TedStrzalkowski.pdf

  build:
    runs-on: ubuntu-latest
    needs: generate-pdf
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: resume-pdf
          path: static/
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true
      - run: hugo --minify
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
